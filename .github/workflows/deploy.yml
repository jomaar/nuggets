name: Deploy to Netcup

on:
  push:
    branches: [main]
  # Manual trigger (Actions → Deploy to Netcup → Run workflow) — for re-running a
  # deploy without an empty commit, e.g. after a GitHub Actions outage cancelled
  # the queued run, or when a build failed for reasons outside the repo.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.NETCUP_HOST }}
          username: ${{ secrets.NETCUP_USER }}
          # SSH key, not a password: the server sets `PasswordAuthentication no`
          # and `PermitRootLogin prohibit-password`, so password auth is closed.
          # Rotating this key = drop the "github-actions-deploy" line from
          # /root/.ssh/authorized_keys and replace the NETCUP_SSH_KEY secret.
          key: ${{ secrets.NETCUP_SSH_KEY }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 22
            cd ~/nuggets.jomaar.de
            [ -f .env ] || echo "DATABASE_URL=file:$(pwd)/nuggets.db" > .env
            # Hard-reset instead of pull: the build regenerates tracked files
            # (e.g. next-env.d.ts) on the server, which makes `git pull` abort on
            # a dirty merge. DB (*.db) and .env are gitignored, so reset is safe.
            git fetch origin main
            git reset --hard origin/main
            npm ci
            set -a; source .env; set +a
            npx prisma generate
            npx prisma migrate deploy
            npx prisma db seed
            export NEXT_PUBLIC_BUILD_VERSION="$(git rev-parse --short HEAD) · $(date '+%d.%m.%Y %H:%M')"
            npm run build
            pm2 delete nuggets || true
            pm2 start npm --name nuggets -- start
            # Embedding daemon behind "Naheliegendes" (Spinnennetz Stufe 1, see
            # lib/embeddings.ts / python/embed_server.py) — long-lived, unlike
            # the other python/ tools, because it's called on every nugget
            # save, not rarely/manually. One more pm2-managed process, not a
            # new supervision paradigm: pm2 already runs the Next process above.
            pm2 delete nuggets-embed || true
            pm2 start /opt/nuggets-python/venv/bin/python3 --name nuggets-embed -- python/embed_server.py
            pm2 save
