name: Deploy to Netcup

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.NETCUP_HOST }}
          username: ${{ secrets.NETCUP_USER }}
          password: ${{ secrets.NETCUP_PASSWORD }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 22
            cd ~/nuggets.jomaar.de
            [ -f .env ] || echo "DATABASE_URL=file:$(pwd)/nuggets.db" > .env
            git pull origin main
            npm ci
            npx prisma generate
            npx prisma migrate deploy
            export NEXT_PUBLIC_BUILD_VERSION="$(git rev-parse --short HEAD) · $(date '+%d.%m.%Y %H:%M')"
            npm run build
            pm2 restart nuggets
